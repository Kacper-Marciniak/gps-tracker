<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>TEST GPS APP - Logs</title>

    <style>
        body {
            margin: 0;
            font-family: monospace;
            background: #111;
            color: #ddd;
        }

        .header {
            padding: 15px 20px;
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
        }

        .logs {
            padding: 20px;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        .log-line {
            padding: 2px 0;
            border-bottom: 1px solid #222;
        }
    </style>
</head>

<body>

<div class="header">
    <strong>TEST GPS APP - Logs</strong>
</div>

<div class="logs">

{% for line in devices %}
<div class="log-line">{{ line }}</div>
{% endfor %}

</div>

</body>
</html>
