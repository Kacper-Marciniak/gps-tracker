<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>TEST GPS APP</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .header {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;

            background: #222;
            color: white;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }

        .logout {
            color: white;
            text-decoration: none;
        }

        #map {
            height: calc(100vh - 50px);
            width: 100%;
        }
    </style>

</head>

<body>

    <div class="header">

        <div class="title">
            GPS Tracker (Map View)
        </div>

        <a class="logout" href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

    <div id="map"></div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        const devices = {{ devices | tojson }};


        // Default map position
        const map = L.map("map").setView(
            [51.1079, 17.0385],
            13
        );


        // OpenStreetMap tiles
        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);


        // Add device markers
        const markers = [];

        // Define a set of colors for the markers
        const colors = [
            "red",
            "blue",
            "green",
            "orange",
            "purple",
            "brown",
            "darkred",
            "darkblue",
            "darkgreen"
        ];

        devices.forEach((device, index) => {

            // Same color for everything belonging to this device
            const color = colors[index % colors.length];


            // Current position marker
            const marker = L.circleMarker(
                [device.latitude, device.longitude],
                {
                    radius: 8,
                    color: color,
                    fillColor: color,
                    fillOpacity: 1
                }
            ).addTo(map);

            marker.bindPopup(`
        <b>ID: ${device.id}</b><br>
        Latitude: ${device.latitude}<br>
        Longitude: ${device.longitude}<br>
        Heading: ${device.heading}<br>
        Speed: ${device.speed}<br>
        Last seen: ${device.datetime}<br>
        Battery: ${device.battery !== null ? device.battery + '%' : 'N/A'}
    `);

            markers.push(marker);


            // GPS traces — solid line
            if (device.traces && device.traces.length > 1) {

                const traceCoordinates = device.traces.map(point => [
                    point.latitude,
                    point.longitude
                ]);

                L.polyline(traceCoordinates, {
                    color: color,
                    weight: 4,
                    opacity: 0.9
                }).addTo(map);
            }


            // Heartbeats — dashed line
            if (device.heartbeats && device.heartbeats.length > 1) {

                const heartbeatCoordinates = device.heartbeats.map(point => [
                    point.latitude,
                    point.longitude
                ]);

                L.polyline(heartbeatCoordinates, {
                    color: color,
                    weight: 3,
                    opacity: 0.7,
                    dashArray: "8, 8"
                }).addTo(map);
            }

        });


        // Automatically fit map to all devices
        if (markers.length > 0) {

            const group = L.featureGroup(markers);

            map.fitBounds(
                group.getBounds().pad(0.2)
            );
        }

    </script>

</body>

</html>
